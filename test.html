<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Daftar Berita</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        tr {
            border-bottom: 1px solid #ccc;
        }
        td {
            padding: 15px;
            vertical-align: top;
        }
        .berita-judul {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .berita-deskripsi {
            color: #555;
        }
        .berita-gambar {
            width: 150px;
        }
        .berita-gambar img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<h2>Daftar Berita Terbaru</h2>

<table>
    <tr>
        <td class="berita-gambar">
            <img src="https://via.placeholder.com/150" alt="Gambar Berita 1">
        </td>
        <td>
            <div class="berita-judul">Judul Berita Pertama</div>
            <div class="berita-deskripsi">Ini adalah deskripsi singkat untuk berita pertama yang menjelaskan isi berita secara umum.</div>
        </td>
    </tr>
    <tr>
        <td class="berita-gambar">
            <img src="https://via.placeholder.com/150" alt="Gambar Berita 2">
        </td>
        <td>
            <div class="berita-judul">Judul Berita Kedua</div>
            <div class="berita-deskripsi">Deskripsi singkat berita kedua yang memberikan ringkasan isi berita dengan jelas.</div>
        </td>
        
    </tr>
    <!-- Tambahkan lebih banyak baris berita di sini -->
</table>

</body>
</html>
